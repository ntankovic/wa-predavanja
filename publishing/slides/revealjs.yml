format:
  revealjs:
    theme: white
    logo: ../../assets/shared/fipu-logo.svg
    progress: true
    footer: "Web Applications · assoc. prof. Nikola Tankovic, PhD"
    include-in-header:
      text: |
        <style>
        .reveal { --r-main-color: #333333; color: #333333; }
        .reveal .progress { height: 6px; background: #d9e0e5; color: #1585b4; }
        .reveal .footer { bottom: 16px; font-size: 14px; color: #666666; }
        .reveal .footer p { margin: 0; }
        .reveal #title-slide { text-align: left; padding-top: 35px; }
        .reveal #title-slide::before {
          content: "";
          display: block;
          width: 140px;
          height: 140px;
          margin-bottom: 32px;
          background: url("../../assets/shared/fipu-logo.svg") left center / contain no-repeat;
        }
        .reveal .slide-logo { max-height: 55px !important; }
        .reveal table { font-size: 0.9em; }
        .reveal table th, .reveal table td { padding: 0.4em 0.65em; vertical-align: top; line-height: 1.3; }
        .reveal table th { font-weight: 700; }
        .reveal table tbody tr:nth-child(even) { background: #f2f2f2; }
        .reveal table tbody tr:nth-child(odd) { background: #fff; }
        /* Terminal look for shell commands (lecturer decision 2026-10-28): `cmd`{.cmd} and ```{.terminal} blocks. */
        .reveal code.cmd { background: #1e2b36; color: #e6edf3; padding: 0.08em 0.45em; border-radius: 6px; font-size: 0.82em; white-space: nowrap; }
        .reveal code.cmd::before { content: "$ "; color: #7ee787; }
        .reveal div.sourceCode:has(> pre.terminal), .reveal pre.terminal { background: #1e2b36; border: none; border-radius: 10px; box-shadow: none; }
        .reveal pre.terminal { position: relative; padding: 34px 18px 14px; color: #e6edf3; width: 100%; box-sizing: border-box; }
        .reveal pre.terminal::before { content: ""; position: absolute; top: 12px; left: 16px; width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; box-shadow: 18px 0 0 #febc2e, 36px 0 0 #28c840; }
        .reveal pre.terminal code { color: #e6edf3; background: transparent; }
        .reveal code.cmd span, .reveal pre.terminal code span { color: inherit !important; font-style: normal !important; font-weight: inherit !important; background: none !important; }
        /* Attendance QR slide after the title slide in every deck (lecturer decision 2026-10-28). */
        .reveal .attendance-slide { text-align: center; }
        .reveal .attendance-slide .attendance-content { margin: 24px auto 0; width: 100%; }
        .reveal .attendance-slide .attendance-content p { margin: 0; }
        .reveal .attendance-slide .attendance-content p + p { margin-top: 0.35em; }
        .reveal .attendance-slide img { margin: 0; width: 455px; height: 455px; }
        </style>
    slide-number: true
    slide-level: 2
    embed-resources: true
execute:
  enabled: false
