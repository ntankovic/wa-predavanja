="3.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/><text x="520.0" y="162.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3886ad">200 + Set-Cookie: sid=abc123</text><text x="230" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536b7b">pamti sid=abc123</text><path d="M230,262 L810,262" fill="none" stroke="#3886ad" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="520.0" y="249.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3886ad">GET /cart + Cookie: sid=abc123</text><text x="810" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536b7b">sid → sesija → košarica</text><path d="M810,345 L230,345" fill="none" stroke="#3886ad" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/><text x="520.0" y="332.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3886ad">200 + košarica tog korisnika</text><text x="520" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#20384d">Kontekst putuje u svakom zahtjevu; HTTP sam ne pamti prethodni zahtjev.</text><text x="520" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#627786">Izmišljen primjer: naš nastavni backend nema /login ni /cart.</text></svg>