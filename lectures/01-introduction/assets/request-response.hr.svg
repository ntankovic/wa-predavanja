<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="240" fill="white"/><rect x="41" y="45" width="278" height="110" rx="16" fill="#24445c" opacity=".035"/><rect x="40" y="42" width="280" height="110" rx="16" fill="#24445c" opacity=".025"/><rect x="40" y="40" width="280" height="110" rx="16" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/><rect x="52" y="68" width="7" height="54" rx="3.5" fill="#3886ad"/><text x="180.0" y="71.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#20384d">Preglednik</text><text x="180.0" y="106.135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536b7b">klijent: započinje</text><text x="180.0" y="130.135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536b7b">razmjenu</text><rect x="721" y="45" width="278" height="110" rx="16" fill="#24445c" opacity=".035"/><rect x="720" y="42" width="280" height="110" rx="16" fill="#24445c" opacity=".025"/><rect x="720" y="40" width="280" height="110" rx="16" fill="#f8fbfd" stroke="#c6dbe8" stroke-width="1.2"/><rect x="732" y="68" width="7" height="54" rx="3.5" fill="#3886ad"/><text x="860.0" y="71.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#20384d">Poslužitelj</text><text x="860.0" y="118.135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536b7b">program koji odgovara</text><path d="M330,80 L710,80" fill="none" stroke="#3886ad" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="520.0" y="67.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3886ad">zahtjev: „Pošalji popis proizvoda.”</text><path d="M710,125 L330,125" fill="none" stroke="#3886ad" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/><text x="520.0" y="112.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#3886ad">odgovor: „Uspjelo je; evo popisa.”</text><text x="520" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#627786">Pune strelice: zahtjevi; isprekidane: odgovori. Isti zapis koristimo cijelo predavanje.</text></svg>