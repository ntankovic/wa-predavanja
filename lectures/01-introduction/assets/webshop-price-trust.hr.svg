<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390"><defs><marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#3886ad"/></marker><marker id="arrow-red" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L18,9 L2,16 Z" fill="#b63842"/></marker></defs><rect width="1040" height="390" fill="white"/><text x="520" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#20384d">Proizvod #7: cijena u bazi 100 € · kupac šalje cijenu 1 €</text><rect x="10" y="58" width="495" height="270" rx="16" fill="#fff4f3" stroke="#b63842" stroke-opacity=".3"/><text x="257" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#b63842">LOŠA PRAKSA</text><text x="257" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#20384d">Klijent šalje: proizvod 7, količina 1, cijena 1 €</text><text x="257" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#20384d">Backend prihvaća poslanu cijenu.</text><text x="257" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#20384d">Narudžba: 1 × 1 € = 1 €</text><text x="257" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#b63842">Posljedica: trgovina gubi 99 €.</text><path d="M257,150 L257,167" fill="none" stroke="#b63842" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect x="535" y="58" width="495" height="270" rx="16" fill="#f1f8f4" stroke="#277b59" stroke-opacity=".3"/><text x="782" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#277b59">DOBRA PRAKSA</text><text x="782" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#20384d">Klijent bira proizvod 7 i količinu 1.</text><text x="782" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#20384d">Backend provjerava unos; cijenu čita iz baze.</text><text x="782" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#20384d">Narudžba: 1 × 100 € = 100 €</text><text x="782" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#277b59">Izmijenjena cijena ne određuje iznos.</text><path d="M782,150 L782,167" fill="none" stroke="#3886ad" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="520" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#20384d">Klijent bira što želi. Backend provjerava pravila i računa cijenu.</text></svg>